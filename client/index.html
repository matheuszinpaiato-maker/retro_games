<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
<img src="./img/logo.png">
    <div class="textos">
        <h1 class="retro">RETRO</h1>
        <h1>GAMES</h1>
    </div>
</header>
    <main class = "container">
        <div class = "titulo-secao">
            <div>
                <h2>Nosso catalogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
        </div>
        <section id="listarDiscos" class="listar-discos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>
    <dialog id = "modalCadastro">
        <h2>Novo Jogo</h2>
        <form id = "formDisco">
            <label for="album">Nome do Jogo</label>
            <input type="text" id="titulo" required>
            <label for="artista">Plataforma</label>
            <input type="text" id="plataforma" required>
            <label for="genero">Desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>
            <label for="imagem">URL da imagem do disco</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01"required>
            <div class = "acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar Jogo</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>

<footer id="contato">
  <h3>Contato</h3>

  <a href="#" target="_blank">WhatsApp</a>
  <a href="#" target="_blank">Instagram</a>

  <p>&copy; 2026 Retro Games</p>
</footer>

</body>
</html>
